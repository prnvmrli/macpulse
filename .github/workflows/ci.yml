name: CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or version for release (e.g. v2.2.2). Defaults to project version if omitted.'
        required: false
        default: ''
      draft:
        description: 'Create as a draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macpulse-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Tests and Validation
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Swift package tests
        run: swift test

      - name: Validate Swift syntax, plists, and scripts
        run: ./scripts/validate-source.sh

      - name: Xcode Debug Build
        run: |
          xcodebuild \
            -project MacPulse.xcodeproj \
            -scheme MacPulse \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

  release:
    name: Build, Package and Release
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Build universal app bundle
        env:
          UNIVERSAL: "1"
        run: ./scripts/build-local.sh

      - name: Inspect and verify artifact
        run: ./scripts/verify-release.sh dist/MacPulse.app

      - name: Package drag-to-install DMG
        env:
          SKIP_FINDER_LAYOUT: "1"
        run: ./scripts/package-dmg.sh dist/MacPulse.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MacPulse-release-artifacts
          path: |
            dist/MacPulse-*.zip
            dist/MacPulse-*.dmg
            dist/MacPulse-*.dmg.sha256
            dist/SHA256SUMS.txt
            dist/xcodebuild.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG:-}" ]]; then
            TAG="${INPUT_TAG}"
          else
            VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/MacPulse.app/Contents/Info.plist)
            TAG="v${VERSION}"
          fi

          echo "Target tag: $TAG"

          EXTRA_ARGS=()
          if [[ "${INPUT_DRAFT:-false}" == "true" ]]; then
            EXTRA_ARGS+=(--draft)
          fi
          if [[ "${INPUT_PRERELEASE:-false}" == "true" ]]; then
            EXTRA_ARGS+=(--prerelease)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Uploading assets..."
            gh release upload "$TAG" \
              dist/MacPulse-*.dmg \
              dist/MacPulse-*.dmg.sha256 \
              dist/MacPulse-*.zip \
              dist/SHA256SUMS.txt \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              dist/MacPulse-*.dmg \
              dist/MacPulse-*.dmg.sha256 \
              dist/MacPulse-*.zip \
              dist/SHA256SUMS.txt \
              --title "MacPulse $TAG" \
              --generate-notes \
              "${EXTRA_ARGS[@]}"
          fi
